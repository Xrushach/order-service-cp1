definitions:
  example_com_order-service_internal_order.CreateOrderInput:
    properties:
      items:
        items:
          $ref: '#/definitions/example_com_order-service_internal_order.Item'
        type: array
    type: object
  example_com_order-service_internal_order.Item:
    properties:
      name:
        type: string
      price:
        type: integer
      quantity:
        type: integer
    type: object
  example_com_order-service_internal_order.Order:
    properties:
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/example_com_order-service_internal_order.Item'
        type: array
      status:
        $ref: '#/definitions/example_com_order-service_internal_order.Status'
      total_price:
        type: integer
    type: object
  example_com_order-service_internal_order.Status:
    enum:
    - new
    - processing
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusProcessing
    - StatusCompleted
    - StatusCancelled
  example_com_order-service_internal_order.StatusChange:
    properties:
      changed_at:
        type: string
      status:
        $ref: '#/definitions/example_com_order-service_internal_order.Status'
    type: object
  example_com_order-service_internal_order.UpdateStatusInput:
    properties:
      status:
        $ref: '#/definitions/example_com_order-service_internal_order.Status'
    type: object
  internal_handler.errorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Сервис для управления заказами (домашнее задание).
  title: API заказов
  version: "1.0"
paths:
  /api/v1/orders:
    get:
      description: Возвращает список всех заказов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/example_com_order-service_internal_order.Order'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Получить все заказы
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Создает новый заказ, проверяет товары и считает сумму
      parameters:
      - description: данные заказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/example_com_order-service_internal_order.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/example_com_order-service_internal_order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Создать заказ
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      description: Возвращает один заказ по его номеру
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example_com_order-service_internal_order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Получить заказ по ID
      tags:
      - orders
  /api/v1/orders/{id}/history:
    get:
      description: Показывает все изменения статуса заказа.
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/example_com_order-service_internal_order.StatusChange'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: История статусов
      tags:
      - orders
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Меняет статус, проверяя, можно ли это сделать
      parameters:
      - description: ID заказа
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/example_com_order-service_internal_order.UpdateStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/example_com_order-service_internal_order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Сменить статус заказа
      tags:
      - orders
swagger: "2.0"
